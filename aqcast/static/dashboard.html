<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Quality Forecast</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2433; --muted: #5e6878; --line: #e3e6eb; --grid: #eef0f3;
    --obs: #3a5a8c; --pers: #8a93a3; --cams: #0f8a8a; --accent: #3a5a8c;
    --g-pm: #3a5a8c; --g-wx: #4f9d69; --g-fire: #d9662b; --g-cams: #0f8a8a; --g-time: #a68a3f; --g-place: #9a8fb3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161d; --panel: #1a2029; --ink: #e8ecf2; --muted: #9aa4b4; --line: #2a323e; --grid: #222a35;
      --obs: #8fb0e6; --pers: #8a93a3; --cams: #4cc3c3; --accent: #8fb0e6;
      --g-pm: #6f93cf; --g-wx: #6dbb86; --g-fire: #ef8a52; --g-cams: #4cc3c3; --g-time: #c9ad5f; --g-place: #b3a8cf;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 18px 24px 10px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  header h1 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  header .meta { color: var(--muted); font-size: 13px; }
  .stale { color: #c0392b; font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(320px, 5fr) minmax(360px, 7fr); gap: 16px; padding: 0 24px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 0 16px 16px; } header { padding: 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
  #map { height: 330px; border-radius: 8px; overflow: hidden; background: var(--grid); }
  .stack { display: grid; gap: 16px; align-content: start; min-width: 0; }
  .controls { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .controls button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px;
                     padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .controls button.on { background: var(--accent); color: var(--panel); border-color: var(--accent); }
  #list { max-height: 560px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 1fr 52px 52px 52px; gap: 6px; align-items: center; padding: 5px 6px;
         border-radius: 6px; cursor: pointer; }
  .row:hover, .row.sel { background: var(--grid); }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .name small { color: var(--muted); margin-left: 4px; }
  .row.head { cursor: default; color: var(--muted); font-size: 12px; background: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; min-width: 44px; text-align: center; border-radius: 5px; padding: 1px 6px;
          font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; }
  #city h3 { margin: 0; font-size: 22px; font-weight: 650; }
  #city .sub { color: var(--muted); margin: 2px 0 12px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  @media (max-width: 520px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .card .lbl { color: var(--muted); font-size: 12px; }
  .card .val { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card .val small { font-size: 12px; font-weight: 400; color: var(--muted); }
  .card .cat { font-size: 12px; margin-top: 2px; }
  .card .vs { font-size: 12px; color: var(--muted); }
  svg text { fill: var(--muted); font-size: 11px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 4px 0 2px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border-radius: 2px; background: var(--c); }
  .drivers { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 6px 0 6px; }
  .drivers div { height: 100%; }
  .feat { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .feat:last-child { border-bottom: none; }
  .feat .num { white-space: nowrap; }
  .up { color: #c0392b; } .down { color: #2e8b57; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .skill { display: grid; grid-template-columns: 110px 1fr 44px; gap: 8px; align-items: center; padding: 2px 0; font-size: 13px; }
  .bar { height: 10px; background: var(--accent); border-radius: 3px; }
  #scores { max-height: 300px; overflow-y: auto; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .leaflet-container { background: var(--grid); font: inherit; }
</style>
</head>
<body>
<header>
  <h1>PM2.5 forecast, 36 cities</h1>
  <div class="meta" id="meta">Loading…</div>
</header>
<main>
  <div class="stack">
    <section class="panel">
      <h2>Map: forecast for the next day</h2>
      <div id="map"></div>
    </section>
    <section class="panel">
      <h2>Cities</h2>
      <div class="controls" id="sort">
        <button data-k="h24" class="on">Worst tomorrow</button>
        <button data-k="name">A–Z</button>
        <button data-k="change">Biggest rise</button>
      </div>
      <div id="list"></div>
    </section>
  </div>
  <div class="stack">
    <section class="panel" id="city"><div class="empty">Choose a city on the map or in the list.</div></section>
    <section class="panel">
      <h2>How the model scored on months it never saw</h2>
      <div class="note" id="scoreNote" style="margin:0 0 8px"></div>
      <div id="scores"></div>
    </section>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
// US EPA PM2.5 categories (24-hour breakpoints, 2024). Used as an indication only for 6-hour forecasts.
const BANDS = [[9.0, "Good", "#00e400", "#14301a"], [35.4, "Moderate", "#ffff00", "#3b3600"],
  [55.4, "Unhealthy for sensitive groups", "#ff7e00", "#2b1400"], [125.4, "Unhealthy", "#ff0000", "#ffffff"],
  [225.4, "Very unhealthy", "#8f3f97", "#ffffff"], [Infinity, "Hazardous", "#7e0023", "#ffffff"]];
const GROUPS = {"recent PM2.5": "--g-pm", "weather": "--g-wx", "fires": "--g-fire", "CAMS": "--g-cams",
                "time": "--g-time", "place": "--g-place"};
const RINGS = {r0: "0–100 km", r100: "100–300 km", r300: "300–600 km", r600: "600–1,000 km"};
const WX = {temp: "temperature", rh: "humidity", pressure: "air pressure", cloud: "cloud", wind: "wind speed",
            wind_u: "east–west wind", wind_v: "north–south wind", rain: "rain", rain_24h: "rain, last 24 h"};
const CAMSN = {pm25: "PM2.5", pm25_24h: "PM2.5, last 24 h", pm10: "PM10", dust: "dust", aod: "aerosol optical depth", co: "carbon monoxide"};

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const band = v => v == null ? null : BANDS.find(b => v <= b[0]);
const fmt = v => v == null ? "–" : (v >= 100 ? Math.round(v) : v.toFixed(1));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const chip = v => { const b = band(v); return b ? `<span class="chip" style="background:${b[2]};color:${b[3]}">${fmt(v)}</span>` : `<span class="chip">–</span>`; };
const get = async path => { const r = await fetch(path); if (!r.ok) throw new Error(`${path}: ${r.status}`); return r.json(); };

function label(f) {
  let m;
  if (f === "pm_3h") return "PM2.5, last 3 hours";
  if (f === "pm_24h") return "PM2.5, last 24 hours";
  if (f === "pm_72h") return "PM2.5, last 3 days";
  if (f === "pm_max_24h") return "PM2.5, highest hour of the last day";
  if (f === "pm_yesterday") return "PM2.5 at this time yesterday";
  if (f === "pm_trend_24h") return "PM2.5 change since yesterday";
  if ((m = f.match(/^fire_(frp|upwind)_(24h|72h)_(r\d+)$/)))
    return `${m[1] === "upwind" ? "Upwind fires" : "Fires"} ${RINGS[m[3]]}, last ${m[2] === "24h" ? "day" : "3 days"}`;
  if ((m = f.match(/^wx_target_(.+)$/))) return `Weather at the forecast time: ${WX[m[1]] || m[1]}`;
  if ((m = f.match(/^wx_(.+)$/))) return `Weather now: ${WX[m[1]] || m[1]}`;
  if ((m = f.match(/^cams_(.+)$/))) return `CAMS now: ${CAMSN[m[1]] || m[1]}`;
  if (f.startsWith("time_local_hour")) return "Time of day";
  if (f.startsWith("time_season")) return "Season";
  if (f === "time_weekday") return "Day of the week";
  if (f === "horizon_h") return "How far ahead";
  if (["lat", "lon", "city"].includes(f)) return "Which city it is";
  return f;
}

function hoursAgo(iso) { return (Date.now() - new Date(iso).getTime()) / 3.6e6; }
function when(iso) {
  return new Date(iso).toLocaleString(undefined, {weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"});
}
function shortWhen(iso) {
  return new Date(iso).toLocaleString(undefined, {weekday: "short", hour: "2-digit", minute: "2-digit"});
}

let STATE = {cities: [], forecast: {}, sort: "h24", selected: null, markers: {}};

// ------------------------------------------------------------------------------------------------ map
function drawMap() {
  const el = document.getElementById("map");
  const pts = STATE.cities;
  if (window.L) {
    const map = L.map(el, {worldCopyJump: true, zoomSnap: 0.5}).setView([22, 30], 1.5);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 10, subdomains: "abcd",
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    for (const c of pts) {
      const b = band(c.h24);
      const m = L.circleMarker([c.lat, c.lon], {radius: 7, weight: 1.5, color: "#1d2433", fillColor: b ? b[2] : "#999", fillOpacity: 0.95})
        .addTo(map).bindTooltip(`${esc(c.name)}: ${fmt(c.h24)} µg/m³ tomorrow`);
      m.on("click", () => select(c.city));
      STATE.markers[c.city] = m;
    }
    STATE.map = map;
    return;
  }
  // Fallback without the map library: cities on a plain longitude/latitude grid.
  const W = 720, H = 330, x = lon => (lon + 180) / 360 * W, y = lat => (75 - lat) / 135 * H;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" role="img" aria-label="Cities by forecast">`;
  for (let lon = -150; lon <= 150; lon += 30) s += `<line x1="${x(lon)}" x2="${x(lon)}" y1="0" y2="${H}" stroke="${css("--line")}"/>`;
  for (let lat = -45; lat <= 60; lat += 15) s += `<line y1="${y(lat)}" y2="${y(lat)}" x1="0" x2="${W}" stroke="${css(lat === 0 ? "--muted" : "--line")}"/>`;
  for (const c of pts) {
    const b = band(c.h24);
    s += `<g class="pt" data-c="${c.city}" style="cursor:pointer"><circle cx="${x(c.lon)}" cy="${y(c.lat)}" r="6" fill="${b ? b[2] : "#999"}" stroke="#1d2433"/>` +
         `<title>${esc(c.name)}: ${fmt(c.h24)} µg/m³ tomorrow</title></g>`;
  }
  el.innerHTML = s + "</svg>";
  el.querySelectorAll(".pt").forEach(g => g.addEventListener("click", () => select(g.dataset.c)));
}

// ----------------------------------------------------------------------------------------------- list
function drawList() {
  const rows = [...STATE.cities];
  const k = STATE.sort;
  rows.sort((a, b) => k === "name" ? a.name.localeCompare(b.name)
                    : k === "change" ? (b.h24 - b.now) / (b.now || 1) - (a.h24 - a.now) / (a.now || 1)
                    : (b.h24 ?? -1) - (a.h24 ?? -1));
  let s = `<div class="row head"><div>City</div><div class="num">Now</div><div class="num">+24 h</div><div class="num">+72 h</div></div>`;
  for (const c of rows) {
    s += `<div class="row${c.city === STATE.selected ? " sel" : ""}" data-c="${c.city}">` +
         `<div class="name">${esc(c.name)}<small>${esc(c.country)}</small></div>` +
         `<div class="num">${fmt(c.now)}</div><div class="num">${chip(c.h24)}</div><div class="num">${chip(c.h72)}</div></div>`;
  }
  const el = document.getElementById("list");
  el.innerHTML = s;
  el.querySelectorAll(".row[data-c]").forEach(r => r.addEventListener("click", () => select(r.dataset.c)));
}

// ------------------------------------------------------------------------------------------------ chart
function chart(c) {
  const rec = c.observed && c.observed.recent;
  if (!rec) return "";
  const t0 = new Date(rec.start_utc).getTime();
  const obs = rec.pm25.map((v, i) => [t0 + i * 3.6e6, v]);
  const fc = c.forecasts.map(f => ({t: new Date(f.target_utc).getTime(), m: f.pm25_adjusted, p: f.persistence, k: f.cams}));
  const tMax = Math.max(...fc.map(f => f.t)) + 6 * 3.6e6;
  const vals = [...obs.map(o => o[1]), ...fc.flatMap(f => [f.m, f.p, f.k])].filter(v => v != null);
  const vMax = Math.max(10, ...vals) * 1.1;
  const W = 680, H = 230, L = 40, R = 10, T = 10, B = 26;
  const X = t => L + (t - t0) / (tMax - t0) * (W - L - R), Y = v => T + (1 - v / vMax) * (H - T - B);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="PM2.5 over the last week and the forecast">`;
  // horizontal grid and labels
  const step = [5, 10, 20, 25, 50, 100, 200].find(st => vMax / st <= 6) || 500;
  for (let v = 0; v <= vMax; v += step)
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${css("--grid")}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}</text>`;
  // day ticks (UTC midnights)
  const d0 = new Date(t0); d0.setUTCHours(24, 0, 0, 0);
  for (let t = d0.getTime(); t < tMax; t += 864e5) {
    const lbl = new Date(t).toLocaleDateString(undefined, {day: "numeric", month: "short", timeZone: "UTC"});
    s += `<line x1="${X(t)}" x2="${X(t)}" y1="${T}" y2="${H - B}" stroke="${css("--grid")}"/><text x="${X(t)}" y="${H - 8}" text-anchor="middle">${lbl}</text>`;
  }
  // observed line, broken at gaps
  let path = "", pen = false;
  for (const [t, v] of obs) {
    if (v == null) { pen = false; continue; }
    path += `${pen ? "L" : "M"}${X(t).toFixed(1)},${Y(v).toFixed(1)}`; pen = true;
  }
  s += `<path d="${path}" fill="none" stroke="${css("--obs")}" stroke-width="1.6"/>`;
  // "now" marker: the forecast's issue time
  const tIssue = new Date(c.issue_utc).getTime();
  s += `<line x1="${X(tIssue)}" x2="${X(tIssue)}" y1="${T}" y2="${H - B}" stroke="${css("--muted")}" stroke-dasharray="3 3"/>` +
       `<text x="${X(tIssue) + 4}" y="${T + 10}">forecast made</text>`;
  // forecast: model line from the last day's mean, persistence and CAMS markers
  const last = c.observed.pm25_last_24h;
  if (last != null) s += `<path d="M${X(tIssue)},${Y(last)}${fc.map(f => `L${X(f.t)},${Y(f.m)}`).join("")}" fill="none" stroke="${css("--ink")}" stroke-width="1.4" stroke-dasharray="5 3"/>`;
  for (const f of fc) {
    if (f.p != null) s += `<rect x="${X(f.t) - 4}" y="${Y(f.p) - 4}" width="8" height="8" fill="none" stroke="${css("--pers")}" stroke-width="1.6"><title>Persistence: ${fmt(f.p)}</title></rect>`;
    if (f.k != null) s += `<path d="M${X(f.t)},${Y(f.k) - 6}l6,6l-6,6l-6,-6z" fill="${css("--cams")}"><title>CAMS: ${fmt(f.k)}</title></path>`;
    const b = band(f.m);
    s += `<circle cx="${X(f.t)}" cy="${Y(f.m)}" r="6" fill="${b ? b[2] : "#999"}" stroke="${css("--ink")}" stroke-width="1.5"><title>This model: ${fmt(f.m)}</title></circle>`;
  }
  s += `<text x="${L}" y="${T - 1}" dy="-1"></text></svg>`;
  return `<div class="legend"><span style="--c:${css("--obs")}">Measured (hourly)</span><span style="--c:${css("--ink")}">This model</span>` +
         `<span style="--c:${css("--cams")}">CAMS forecast</span><span style="--c:${css("--pers")}">Persistence (last 24 h)</span></div>` + s;
}

// ----------------------------------------------------------------------------------------------- city panel
async function select(slug) {
  STATE.selected = slug;
  drawList();
  if (STATE.map && STATE.markers[slug]) STATE.markers[slug].openTooltip();
  const el = document.getElementById("city");
  let c;
  try { c = await get(`/forecast/${encodeURIComponent(slug)}`); }
  catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  const cards = [`<div class="card"><div class="lbl">Last 24 hours</div><div class="val">${fmt(c.observed?.pm25_last_24h)} <small>µg/m³</small></div>` +
                 `<div class="cat">${esc(band(c.observed?.pm25_last_24h)?.[1] || "")}</div><div class="vs">measured</div></div>`];
  for (const f of c.forecasts) {
    const b = band(f.pm25_adjusted);
    cards.push(`<div class="card" style="border-color:${b ? b[2] : "var(--line)"};border-width:2px">` +
      `<div class="lbl">+${f.horizon_h} h · ${esc(shortWhen(f.target_utc))}</div><div class="val">${fmt(f.pm25_adjusted)} <small>µg/m³</small></div>` +
      `<div class="cat">${esc(f.category || "")}</div><div class="vs">CAMS ${fmt(f.cams)} · persistence ${fmt(f.persistence)}</div></div>`);
  }
  const f24 = c.forecasts[0];
  const total = Object.values(f24.drivers_pct).reduce((a, b) => a + b, 0) || 1;
  const bar = Object.entries(f24.drivers_pct).map(([g, v]) =>
    `<div style="width:${v / total * 100}%;background:${css(GROUPS[g] || "--muted")}" title="${esc(g)}: ${v}%"></div>`).join("");
  const legend = Object.entries(f24.drivers_pct).map(([g, v]) => `<span style="--c:${css(GROUPS[g] || "--muted")}">${esc(g)} ${Math.round(v)}%</span>`).join("");
  const feats = f24.top_features.map(t => `<div class="feat"><div>${esc(label(t.feature))}</div>` +
    `<div class="num ${t.effect_pct >= 0 ? "up" : "down"}">${t.effect_pct >= 0 ? "▲ +" : "▼ "}${t.effect_pct}%</div></div>`).join("");
  el.innerHTML =
    `<h3>${esc(c.name)}</h3><div class="sub">${esc(c.country)} · known for ${esc(c.known_for)} · measured up to ${esc(when(c.observed?.last_hour_utc))}</div>` +
    `<div class="cards">${cards.join("")}</div>` +
    `<h2>Last 7 days and the forecast (µg/m³)</h2>${chart(c)}` +
    `<h2 style="margin-top:14px">What drives tomorrow's forecast</h2><div class="drivers">${bar}</div><div class="legend">${legend}</div>` +
    `<h2 style="margin-top:14px">What moved it most</h2>${feats}` +
    `<div class="note">Percentages compare this forecast with the model's average forecast across all 36 cities, so a polluted city's own recent PM2.5 and its location push it far up. ` +
    `Categories follow the US EPA PM2.5 scale, which is defined for 24-hour means; for these 6-hour forecasts they are indicative. Not an official air-quality service.</div>`;
}

// ------------------------------------------------------------------------------------------------ scores
function drawScores(m) {
  const rows = (m.scores_by_city || []).slice().sort((a, b) => b.skill_vs_persistence - a.skill_vs_persistence);
  const overall = (m.scores || []).find(s => s.test === "held-out months");
  const recent = (m.scores || []).find(s => s.test === "recent");
  document.getElementById("scoreNote").innerHTML = overall
    ? `Errors ${Math.round(overall.skill_vs_persistence * 100)}% smaller than persistence on held-out months` +
      (recent ? `, ${Math.round(recent.skill_vs_persistence * 100)}% on the most recent 90 days` : "") +
      `. Trained on ${esc((m.trained_from || "").slice(0, 10))} to ${esc((m.trained_to || "").slice(0, 10))}.` : "";
  const names = Object.fromEntries(STATE.cities.map(c => [c.city, c.name]));
  const max = Math.max(0.01, ...rows.map(r => r.skill_vs_persistence));
  document.getElementById("scores").innerHTML = rows.map(r =>
    `<div class="skill"><div>${esc(names[r.city] || r.city)}</div><div><div class="bar" style="width:${Math.max(0, r.skill_vs_persistence) / max * 100}%"></div></div>` +
    `<div class="num">${Math.round(r.skill_vs_persistence * 100)}%</div></div>`).join("") || `<div class="empty">No scores yet.</div>`;
}

// ------------------------------------------------------------------------------------------------- start
async function start() {
  try {
    const [cities, fc, health] = await Promise.all([get("/cities"), get("/forecast"), get("/health")]);
    const byCity = Object.fromEntries(fc.cities.map(c => [c.city, c]));
    STATE.cities = cities.map(c => {
      const f = (byCity[c.city] || {forecasts: []}).forecasts;
      const h = k => (f.find(x => x.horizon_h === k) || {}).pm25_adjusted ?? null;
      return {...c, now: c.observed ? c.observed.pm25_last_24h : null, h24: h(24), h48: h(48), h72: h(72)};
    });
    const age = health.age_hours;
    document.getElementById("meta").innerHTML =
      `Forecast made ${esc(when(fc.made_utc))} · ${STATE.cities.length} cities` +
      (age > 12 ? ` · <span class="stale">${Math.round(age)} hours old; run the forecast job</span>` : "");
    drawMap();
    drawList();
    const worst = [...STATE.cities].sort((a, b) => (b.h24 ?? -1) - (a.h24 ?? -1))[0];
    if (worst) select(worst.city);
  } catch (e) {
    document.getElementById("meta").textContent = "No forecast available yet. Run: docker compose run --rm forecast";
    document.getElementById("city").innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
  get("/model").then(drawScores).catch(() => { document.getElementById("scores").innerHTML = `<div class="empty">No trained model found.</div>`; });
}
document.getElementById("sort").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  STATE.sort = b.dataset.k;
  document.querySelectorAll("#sort button").forEach(x => x.classList.toggle("on", x === b));
  drawList();
});
start();
</script>
</body>
</html>
