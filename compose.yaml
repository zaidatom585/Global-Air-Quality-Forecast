# Local development:
#   docker compose build
#   docker compose run --rm tests                      run the test suite
#   docker compose run --rm sync sensors               choose OpenAQ sensors (first time)
#   docker compose run --rm sync backfill --source all download history since Aug 2022
#   docker compose run --rm sync update                recent data + current forecasts
#   docker compose run --rm sync status                what is on disk
#   docker compose run --rm prepare all                checks, fire features and the training table
#   docker compose run --rm train                      train and test the model, explain each city
#   docker compose run --rm forecast                   forecasts for every city from the latest data
#   docker compose up -d api                           the forecast API on http://localhost:8000/docs
name: aqcast

services:
  sync:
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: runtime
    image: aqcast-sync:dev
    pull_policy: build
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data

  prepare:
    image: aqcast-prepare:dev         # same build as the collector (cached), started with another command
    pull_policy: build
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: runtime
    entrypoint: ["python", "-m", "aqcast.prepare"]
    command: ["all"]
    volumes:
      - ./data:/data
    profiles: ["jobs"]

  train:
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: train
    image: aqcast-train:dev
    pull_policy: build
    volumes:
      - ./data:/data:ro               # training only reads the data
      - ./models:/models
    profiles: ["jobs"]

  forecast:
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: train
    image: aqcast-forecast:dev       # same build as train (cached), another command
    pull_policy: build
    entrypoint: ["python", "-m", "aqcast.forecast"]
    volumes:
      - ./data:/data
      - ./models:/models:ro
    profiles: ["jobs"]

  api:
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: api
    image: aqcast-api:dev
    pull_policy: build
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - ./models:/models:ro
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: containers/sync.Dockerfile
      target: test
    image: aqcast-sync:test
    pull_policy: build
    profiles: ["test"]
