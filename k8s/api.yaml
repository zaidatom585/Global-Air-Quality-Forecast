# The forecast API: two copies behind one Service, so one can restart while the other answers.
# It only reads files, so both copies mount the data and model folders read-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app.kubernetes.io/name: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: aqcast-api:dev
          imagePullPolicy: Never                 # built locally by `docker compose build`
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: AQ_DATA_DIR, value: /data}
            - {name: AQ_MODEL_DIR, value: /models}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data, readOnly: true}
        - name: models
          persistentVolumeClaim: {claimName: models, readOnly: true}
        - name: tmp
          emptyDir: {}
---
# Docker Desktop maps LoadBalancer services to localhost: the API is at http://localhost:8080
# (8080, so it doesn't clash with the Compose API on 8000).
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8080, targetPort: http}
