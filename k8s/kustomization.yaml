# Everything for Kubernetes on Docker Desktop, with locally built images:  kubectl apply -k k8s
# The API keys are not here: they go into a Secret created from your .env (see README, "Run on Kubernetes").
# The manifests live in base/, so that overlays/ghcr can reuse them without kustomize seeing a loop
# (a kustomization may not include a folder that contains itself).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - base
