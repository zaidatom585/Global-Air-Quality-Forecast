# Every 6 hours, 20 minutes after the CAMS/weather issue times (00, 06, 12, 18 UTC): fresh data, the checked
# PM2.5 series and new forecasts. The steps run in order as init containers, then the forecast. A data source
# that fails (an API outage) is logged and the pipeline carries on with what it has; only a failed forecast
# fails the job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline
spec:
  schedule: "20 0,6,12,18 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid                    # never two runs writing the same files
  startingDeadlineSeconds: 3600                # if the PC was asleep at run time, still run within the hour
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: pipeline}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: update
              image: aqcast-sync:dev
              imagePullPolicy: Never
              command: ["sh", "-c"]
              args: ["python -m aqcast.sync update || echo 'update finished with failures; continuing'"]
              envFrom:
                - secretRef: {name: aqcast-keys, optional: true}   # OPENAQ_API_KEY, FIRMS_MAP_KEY
              env:
                - {name: AQ_DATA_DIR, value: /data}
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits: {cpu: "1", memory: 1Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
            - name: clean
              image: aqcast-sync:dev
              imagePullPolicy: Never
              command: ["sh", "-c"]
              args: ["python -m aqcast.prepare clean || echo 'clean failed; continuing'"]
              env:
                - {name: AQ_DATA_DIR, value: /data}
              resources:
                requests: {cpu: 250m, memory: 1Gi}
                limits: {cpu: "2", memory: 3Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: forecast
              image: aqcast-train:dev
              imagePullPolicy: Never
              command: ["python", "-m", "aqcast.forecast"]
              env:
                - {name: AQ_DATA_DIR, value: /data}
                - {name: AQ_MODEL_DIR, value: /models}
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: "2", memory: 2Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: models, mountPath: /models, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: data}
            - name: models
              persistentVolumeClaim: {claimName: models, readOnly: true}
            - name: tmp
              emptyDir: {}
