# Rebuilds the training table and retrains the model. Suspended: it never runs on its own (retraining reads
# ~3 GB of fire data and needs 4-6 GB of memory). Start it by hand when you want a fresh model:
#   kubectl -n aqcast create job --from=cronjob/retrain retrain-now
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain
spec:
  schedule: "0 2 * * 0"                        # Sundays 02:00 UTC, if ever un-suspended
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels: {app.kubernetes.io/name: retrain}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: prepare
              image: aqcast-sync:dev
              imagePullPolicy: Never
              command: ["python", "-m", "aqcast.prepare", "all"]
              env:
                - {name: AQ_DATA_DIR, value: /data}
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "4", memory: 5Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: tmp, mountPath: /tmp}
          containers:
            - name: train
              image: aqcast-train:dev
              imagePullPolicy: Never
              command: ["python", "-m", "aqcast.train"]
              env:
                - {name: AQ_DATA_DIR, value: /data}
                - {name: AQ_MODEL_DIR, value: /models}
              resources:
                requests: {cpu: "1", memory: 2Gi}
                limits: {cpu: "4", memory: 5Gi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data, readOnly: true}
                - {name: models, mountPath: /models}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: data}
            - name: models
              persistentVolumeClaim: {claimName: models}
            - name: tmp
              emptyDir: {}
