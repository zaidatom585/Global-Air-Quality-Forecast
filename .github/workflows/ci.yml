# CI: tests, Kubernetes manifest checks, and container images that are scanned before they are published.
#
#   every push and pull request   tests + manifest checks + build and scan the three images
#   push to main, tag v*          ...and publish the images to GitHub Container Registry (ghcr.io)
#   every Monday                  rebuild and rescan, to catch vulnerabilities found since the last build
#
# Supply chain: only GitHub's and Docker's own actions are used. Trivy runs from its container image pinned to
# 0.69.3, the last release before the March 2026 Trivy compromise (CVE-2026-33634), rather than through
# aquasecurity/trivy-action, whose tags were repointed to malicious code in that incident.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read            # every job starts read-only; publishing gets more below

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3
  KUBECONFORM_VERSION: v0.6.7

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sync.Dockerfile
          target: test
          load: true
          tags: aqcast-tests:ci
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max
      - name: Run the tests
        run: docker run --rm aqcast-tests:ci

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Check the manifests against the Kubernetes API schemas
        run: |
          for dir in k8s k8s/overlays/ghcr; do
            echo "== $dir"
            kubectl kustomize "$dir" > rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
          done

  images:
    needs: [tests, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write       # only this job can publish, and only outside pull requests
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: sync, target: runtime}
          - {name: train, target: train}
          - {name: api, target: api}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sync.Dockerfile
          target: ${{ matrix.target }}
          pull: true        # always start from the newest patched base image
          load: true
          tags: scan/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: Vulnerability report (HIGH and CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 scan/${{ matrix.name }}:ci

      - name: Fail on fixable CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --quiet scan/${{ matrix.name }}:ci

      - name: Software bill of materials (CycloneDX)
        run: |
          mkdir -p out
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/out:/out" "$TRIVY_IMAGE" image \
            --format cyclonedx --output /out/sbom-${{ matrix.name }}.cdx.json scan/${{ matrix.name }}:ci
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.name }}
          path: out/sbom-${{ matrix.name }}.cdx.json

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.name }}
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sync.Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
